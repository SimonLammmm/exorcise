name: exorcise
channels:
  - conda-forge
  - bioconda
dependencies:
  # Ranges and sequences
  - bioconductor-biostrings=2.78.0
  - bioconductor-genomicranges=1.62.1
  - bioconductor-rtracklayer=1.70.1
  # Data handling
  - r-data.table=1.18.4
  - r-dplyr=1.2.1
  - r-tibble=3.3.1
  - r-tidyr=1.3.2
  - r-tidyselect=1.2.1
  # Required so that data.table::fread can read gzipped files. Nothing in
  # exorcise calls R.utils directly, and it is deliberately not library()ed, but
  # fread reaches for it to decompress. Most exorcise inputs are .gz, so dropping
  # this breaks reading almost every input.
  - r-r.utils=2.13.0
  # CLI and logging
  - r-logger=0.4.2
  - r-optparse=1.8.2
  # Plotting, for exorcise-trace
  - r-ggplot2=4.0.3
  - r-htmlwidgets=1.6.4
  - r-plotly=4.12.0
  # Required so that htmlwidgets::saveWidget can produce a self-contained HTML
  # plot. Nothing calls pandoc directly; htmlwidgets shells out to it to inline
  # the JavaScript. Without it the interactive trace is silently downgraded.
  # Given a loose bound rather than an exact pin because pandoc only bundles
  # assets, so its version cannot affect any analysis result.
  - pandoc>=3.1
  # Alignment
  - ucsc-blat=482
  - ucsc-twobittofa=482
